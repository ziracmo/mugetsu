[package]
name = "mugetsu-app"
version = "0.4.1"
edition = "2024"

# Capitalised: macOS shows the executable name in the Dock and menu bar.
[[bin]]
name = "Mugetsu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = "0.4.45"
dirs = "7.0.0"
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
gix = { version = "0.89", default-features = false }
gpui-kit = "0.7.3"
mugetsu-forge = { version = "0.4.1", path = "../mugetsu-forge" }
mugetsu-git = { version = "0.4.1", path = "../mugetsu-git" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.3"
sys-locale = "0.3"
# Same version GPUI renders SVGs with; only used to read an SVG's size.
usvg = { version = "0.46", default-features = false }

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
