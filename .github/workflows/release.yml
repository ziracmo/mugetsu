name: Release

# Push a tag like v0.2.0 (or run this workflow by hand with a tag name, created on
# the chosen branch if missing) to build the installers and publish a GitHub release.
# Pull requests touching the packaging only build, to catch breakage early.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - packaging/**
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && 'v0.0.0-pr') || github.ref_name }}

jobs:
  macos:
    name: Mugetsu.dmg (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/bundle-macos.sh --universal
      - run: scripts/dmg-macos.sh dist/Mugetsu.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Mugetsu.dmg

  windows:
    name: Mugetsu-Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mugetsu-app
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "$env:TAG".TrimStart('v')
          iscc /DAppVersion=$version /DSourceExe="$PWD\target\release\Mugetsu.exe" /DOutputDir="$PWD\dist" packaging\windows\mugetsu.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Mugetsu-Setup.exe

  release:
    name: GitHub release
    needs: [macos, windows]
    # Publish the Mac build even if Windows fails; the .exe is added when it builds.
    if: always() && github.event_name != 'pull_request' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Mugetsu ${{ env.TAG }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.TAG, '-') }}
