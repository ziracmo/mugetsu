name: Release

# Push a tag like v0.2.0 (or run this workflow by hand with a tag name, created on
# the chosen branch if missing) to build the installers and publish a GitHub release.
# Pull requests touching the packaging only build, to catch breakage early.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - packaging/**
      - releases/**
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && 'v0.0.0-pr') || github.ref_name }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release-notes.py check
      - if: github.event_name != 'pull_request'
        env:
          # Notarized builds open with no Gatekeeper warning: drop those steps from the notes.
          SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' }}
        run: |
          mkdir -p notes
          python3 scripts/release-notes.py body "$TAG" notes/body.md
          cp "releases/$TAG.json" notes/release-notes.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes

  # Signing, notarization and the Sparkle appcast each run only when their secrets exist
  # (list in docs/RELEASING.md); without them the build stays ad-hoc signed with no updater.
  macos:
    name: Mugetsu.dmg (universal)
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      # Sparkle is embedded only when the appcast can be signed too.
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' && vars.SPARKLE_PUBLIC_ED_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [[ -z "$IDENTITY" ]]; then echo "::error::no Developer ID Application identity in the .p12"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - run: scripts/bundle-macos.sh --universal
      - run: scripts/dmg-macos.sh dist/Mugetsu.dmg
      - name: Notarize and staple
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/Mugetsu.dmg --wait --timeout 30m \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple dist/Mugetsu.dmg
          spctl --assess --type open --context context:primary-signature --verbose dist/Mugetsu.dmg
      - name: Sparkle appcast
        if: env.SPARKLE_PUBLIC_ED_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Pull requests have no notes for their fake tag: exercise the newest real ones.
          NOTES_TAG=$TAG
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then NOTES_TAG=$(python3 scripts/release-notes.py latest); fi
          SIGN_UPDATE=$(ls target/sparkle-*/bin/sign_update | head -1)
          SIGNATURE=$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - dist/Mugetsu.dmg \
            | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [[ -z "$SIGNATURE" ]]; then echo "::error::sign_update produced no signature"; exit 1; fi
          python3 scripts/release-notes.py appcast "$NOTES_TAG" dist/Mugetsu.dmg "$SIGNATURE" dist/appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Mugetsu.dmg
            dist/appcast.xml

  windows:
    name: Mugetsu-Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mugetsu-app
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "$env:TAG".TrimStart('v')
          iscc /DAppVersion=$version /DSourceExe="$PWD\target\release\Mugetsu.exe" /DOutputDir="$PWD\dist" packaging\windows\mugetsu.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Mugetsu-Setup.exe

  release:
    name: GitHub release
    needs: [notes, macos, windows]
    # Publish the Mac build even if Windows fails; the .exe is added when it builds.
    if: always() && github.event_name != 'pull_request' && needs.notes.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Mugetsu ${{ env.TAG }}
          body_path: dist/body.md
          files: |
            dist/Mugetsu.dmg
            dist/Mugetsu-Setup.exe
            dist/release-notes.json
            dist/appcast.xml
          prerelease: ${{ contains(env.TAG, '-') }}
