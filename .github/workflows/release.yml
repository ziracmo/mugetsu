name: Release

# Push a tag like v0.2.0 (or run this workflow by hand with a tag name, created on
# the chosen branch if missing) to build the installers and publish a GitHub release.
# Pull requests touching the packaging only build, to catch breakage early.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - packaging/**
      - releases/**
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && 'v0.0.0-pr') || github.ref_name }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release-notes.py check
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p notes
          python3 scripts/release-notes.py body "$TAG" notes/body.md
          cp "releases/$TAG.json" notes/release-notes.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes

  macos:
    name: Mugetsu.dmg (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/bundle-macos.sh --universal
      - run: scripts/dmg-macos.sh dist/Mugetsu.dmg
      # On pull requests, photograph the mounted DMG's Finder window so layout changes can be checked.
      - name: Screenshot the DMG window
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          hdiutil attach dist/Mugetsu.dmg
          open /Volumes/Mugetsu
          sleep 6
          mkdir -p preview && screencapture -x preview/dmg-window.png
          hdiutil detach /Volumes/Mugetsu || true
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dmg-preview
          path: preview
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Mugetsu.dmg

  windows:
    name: Mugetsu-Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --locked -p mugetsu-app
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "$env:TAG".TrimStart('v')
          iscc /DAppVersion=$version /DSourceExe="$PWD\target\dist\Mugetsu.exe" /DOutputDir="$PWD\dist" packaging\windows\mugetsu.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Mugetsu-Setup.exe

  release:
    name: GitHub release
    needs: [notes, macos, windows]
    # Publish the Mac build even if Windows fails; the .exe is added when it builds.
    if: always() && github.event_name != 'pull_request' && needs.notes.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Builds are unsigned: checksums at least let a download be verified.
      - run: cd dist && sha256sum Mugetsu.dmg $(ls Mugetsu-Setup.exe 2>/dev/null) > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Mugetsu ${{ env.TAG }}
          body_path: dist/body.md
          files: |
            dist/Mugetsu.dmg
            dist/Mugetsu-Setup.exe
            dist/release-notes.json
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(env.TAG, '-') }}
