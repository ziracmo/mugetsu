name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast gate on every PR: format, lint and the whole test suite on Linux.
  # GPUI's test platform is headless, so the UI tests run here too.
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfreetype-dev libfontconfig-dev libwayland-dev
      - name: Configure git identity for fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and integration tests (mugetsu-git, mugetsu-forge)
        run: cargo test -p mugetsu-git -p mugetsu-forge --locked
      - name: App tests (unit, components, UI flows)
        run: cargo test -p mugetsu-app --locked

  # Same suite on the platform the app ships on first (macOS-only code paths).
  test:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git identity for fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Zipped app as a CI artifact, on demand only (Actions › CI › Run workflow);
  # release builds come from release.yml on tags.
  app:
    name: Mugetsu.app (macOS)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/bundle-macos.sh --no-install
      - name: Zip the app
        run: cd target/release && ditto -c -k --keepParent Mugetsu.app Mugetsu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mugetsu-macos
          path: target/release/Mugetsu.zip
